[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofpost"
version = "1.0.0"
description = "Turn real customer reviews into compliant, on-brand social posts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chandini Pradhan" }]
dependencies = ["pydantic>=2.6", "pyyaml>=6.0", "openpyxl>=3.1", "requests>=2.31"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
app = ["streamlit>=1.35"]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
proofpost = "proofpost.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["proofpost"]
